#
# gitleaks configuration: the default rules, minus Cargo lockfiles, which
# list package names, versions, sources and checksums and nothing else.

title = "refineid-unix"

[extend]
useDefault = true

[[allowlists]]
description = "Cargo lockfiles hold no secrets"
paths = ['''(^|/)Cargo\.lock$''']
