name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'INSTALL'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'INSTALL'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Run the check through the flake dev shell so CI's rustfmt is
      # byte-identical to the pinned toolchain a developer gets from
      # `nix develop`; a version skew would flag formatting the
      # maintainer's rustfmt considers clean. fmt parses only, so no
      # card, reader, or system-library build is involved.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop --command cargo fmt --all --check

  nix-build:
    name: Nix build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check --no-update-lock-file -L
      - run: nix build --no-update-lock-file --no-link -L
