# Enables Bluetooth LE on every USB Bluetooth adapter attach (boot,
# resume, hot-plug). devd runs only the highest-priority attach statement
# that matches an event, so this one sits above /etc/devd/bluetooth.conf
# (attach 100) and runs that statement's action itself before the
# refineid-bluetooth-le hook. devd waits for each action; the hook runs in
# the background so its bounded wait for the HCI node never holds devd.
attach 110 {
	device-name "ubt[0-9]+";
	action "service bluetooth quietstart $device-name; @HOOK@ $device-name &";
};
