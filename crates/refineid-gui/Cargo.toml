[package]
name = "refineid-gui"
description = "RefineID desktop application: document signing, PIN management and phone pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# GTK4 driver (Tier 1, modern desktop with Apple HIG).
gtk4 = ["dep:refineid-gui-gtk4"]
# FLTK driver (Tier 2, lightweight/minimal).
fltk = ["dep:refineid-gui-fltk"]
default = ["gtk4"]

[dependencies]
refineid-gui-core = { path = "../refineid-gui-core", version = "26" }

refineid-gui-fltk = { path = "../refineid-gui-fltk", version = "26", optional = true }
refineid-gui-gtk4 = { path = "../refineid-gui-gtk4", version = "26", optional = true }

refineid-lib-core.workspace = true
refineid-dev-errors.workspace = true
