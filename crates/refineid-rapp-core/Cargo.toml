[package]
name = "refineid-rapp-core"
description = "Remote Authorization Proxy Protocol (RAPP) v26.11.8 requester for Unix workstations, built on refineid-rapp."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
refineid-rapp.workspace = true
refineid-dev-errors.workspace = true
getrandom.workspace = true
# geteuid(2), for whether a record file belongs to this process.
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true
socket2.workspace = true
zeroize.workspace = true

# socket(2), bind(2), connect(2), setsockopt(2), poll(2) for the BLE
# transport's Bluetooth sockets (ble::freebsd::sys).
[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"
