[package]
name = "refineid-unix-pkcs11"
description = "PKCS#11 v2.40 module for FINEID: local readers through refineid-core, and the paired phone as a slot."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
pin-change = ["refineid-pkcs11/pin-change"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
name = "refineid_pkcs11"

[dependencies]
refineid-lib-core.workspace = true
refineid-lib-pcsc.workspace = true
refineid-pkcs11.workspace = true
refineid-rapp.workspace = true
refineid-rapp-core.workspace = true
refineid-remote.workspace = true
# geteuid(2), for whether the pairing store belongs to this process.
libc = "0.2"
