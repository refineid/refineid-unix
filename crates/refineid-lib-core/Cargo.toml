[package]
name = "refineid-lib-core"
description = "FINEID smartcard protocol core -- ports, transport, PACE, secure messaging, eMRTD. Entities and use cases, no PKCS#11 awareness, no HTTP awareness, no GUI awareness."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Crypto stack for PACE + secure messaging.
aes.workspace = true
cbc.workspace = true
cmac.workspace = true
crypto-bigint.workspace = true
subtle.workspace = true
# Standards-based ASN.1 / X.690 DER parsing (re-exports `der`).
spki.workspace = true
# Compile-time dotted-decimal OID parser for the `oid::known` table.
const-oid.workspace = true
sha2.workspace = true
# Secret-material zeroize-on-drop -- `PinBytes` in `pin`.
zeroize.workspace = true

refineid-apdu.workspace = true
refineid-atr.workspace = true
refineid-auth.workspace = true
refineid-ber.workspace = true
refineid-cms.workspace = true
refineid-digest.workspace = true
refineid-pace.workspace = true
refineid-pkcs15.workspace = true
refineid-sign.workspace = true

[build-dependencies]
refineid-build-number.workspace = true

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
refineid-cms = { workspace = true, features = ["testkit"] }
